$kind: "http-example"
name: wash-return
order: 1000
request:
  url: '{{base_url}}/v1/decide'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "decision": "return",
        "exceptions": [
          {
            "code": "AMOUNT_MISMATCH",
            "detail": "presented=10050 issued=10000"
          },
          {
            "code": "PAYEE_MISMATCH",
            "detail": "presented=FRAUDSTER LLC issued=ACME SUPPLIES LLC"
          }
        ],
        "correlation_id": "postman-check-wash",
        "latency_ms": 2
      }
