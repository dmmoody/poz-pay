$kind: "http-example"
name: wash-return
order: 1000
request:
  url: '{{base_url}}/v1/decide'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "decision": "return",
        "exceptions": [
          {
            "code": "AMOUNT_MISMATCH",
            "facts": {
              "presented_amount": 10050,
              "issued_amount": 10000
            }
          },
          {
            "code": "PAYEE_MISMATCH",
            "facts": {
              "presented_payee": "FRAUDSTER LLC",
              "issued_payee": "ACME SUPPLIES LLC"
            }
          }
        ],
        "correlation_id": "postman-check-wash",
        "latency_ms": 2
      }
