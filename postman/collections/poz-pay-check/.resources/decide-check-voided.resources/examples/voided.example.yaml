$kind: "http-example"
name: voided
order: 1000
request:
  url: '{{base_url}}/v1/decide'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "decision": "return",
        "reason_code": "CHECK_VOIDED",
        "reason": "Check voided in register",
        "exceptions": [
          {
            "code": "CHECK_VOIDED",
            "severity": "hard",
            "detail": "check_number=1003"
          }
        ],
        "correlation_id": "postman-check-voided",
        "latency_ms": 1
      }
