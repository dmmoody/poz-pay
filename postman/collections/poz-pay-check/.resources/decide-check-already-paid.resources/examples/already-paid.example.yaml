$kind: "http-example"
name: already-paid
order: 1000
request:
  url: '{{base_url}}/v1/decide'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "decision": "return",
        "reason_code": "CHECK_ALREADY_PAID",
        "reason": "Check already paid/presented",
        "exceptions": [
          {
            "code": "CHECK_ALREADY_PAID",
            "severity": "hard",
            "detail": "check_number=1004"
          }
        ],
        "correlation_id": "postman-check-already-paid",
        "latency_ms": 1
      }
