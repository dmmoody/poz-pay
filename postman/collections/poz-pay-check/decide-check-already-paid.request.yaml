$kind: "http-request"
name: decide-check-already-paid
method: POST
url: '{{base_url}}/v1/decide'
order: 4600
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rail": "check",
      "fi_id": "{{fi_id}}",
      "account_id": "{{account_id}}",
      "correlation_id": "postman-check-already-paid",
      "check": {
        "check_number": "1004",
        "amount": 7500,
        "payee": "OFFICE DEPOT"
      }
    }
examples: './.resources/decide-check-already-paid.resources/examples'
