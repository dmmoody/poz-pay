$kind: "http-request"
name: decide-check-return
method: POST
url: '{{base_url}}/v1/decide'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rail": "check",
      "fi_id": "{{fi_id}}",
      "account_id": "{{account_id}}",
      "correlation_id": "postman-check-missing",
      "check": {
        "check_number": "9999",
        "amount": 10000,
        "payee": "UNKNOWN"
      }
    }
examples: './.resources/decide-check-return.resources/examples'
