$kind: "http-request"
name: decide-check-pay
method: POST
url: '{{base_url}}/v1/decide'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rail": "check",
      "fi_id": "{{fi_id}}",
      "account_id": "{{account_id}}",
      "correlation_id": "postman-check-pay",
      "check": {
        "check_number": "1001",
        "amount": 10000,
        "payee": "ACME SUPPLIES LLC",
        "issue_date": "2026-10-01"
      }
    }
examples: './.resources/decide-check-pay.resources/examples'
