$kind: "http-request"
name: post-check-again
method: POST
url: '{{base_url}}/v1/fis/:fi_id/accounts/:account_id/check-postings'
order: 4800
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: fi_id
    value: '{{fi_id}}'
  - key: account_id
    value: '{{account_id}}'
body:
  type: json
  content: |-
    {
      "check_number": "1005",
      "correlation_id": "postman-check-1005-post-again"
    }
examples: './.resources/post-check-again.resources/examples'
